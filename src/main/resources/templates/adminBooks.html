<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8" />
    <title>Manage Books - Admin Dashboard</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        * { font-family: 'Inter', sans-serif; }

        @keyframes slideInLeft {
            from { transform: translateX(-100%); opacity: 0; }
            to { transform: translateX(0); opacity: 1; }
        }

        @keyframes slideOutLeft {
            from { transform: translateX(0); opacity: 1; }
            to { transform: translateX(-100%); opacity: 0; }
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes slideDown {
            from { opacity: 0; transform: translateY(-20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes modalIn {
            from { opacity: 0; transform: scale(0.95); }
            to { opacity: 1; transform: scale(1); }
        }

        @keyframes overlayIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        .toast-enter { animation: slideInLeft 0.4s cubic-bezier(0.68, -0.55, 0.265, 1.55); }
        .toast-exit { animation: slideOutLeft 0.3s ease-in; }
        .fade-in { animation: fadeIn 0.5s ease-out; }
        .slide-down { animation: slideDown 0.3s ease-out; }
        .modal-enter { animation: modalIn 0.3s ease-out; }
        .overlay-enter { animation: overlayIn 0.3s ease-out; }

        .gradient-bg {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        }

        .glass-effect {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
        }

        /* Custom Scrollbar */
        ::-webkit-scrollbar {
            width: 10px;
            height: 10px;
        }

        ::-webkit-scrollbar-track {
            background: #f1f1f1;
        }

        ::-webkit-scrollbar-thumb {
            background: #667eea;
            border-radius: 5px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: #5568d3;
        }

        /* Table styles */
        .table-hover tbody tr {
            transition: all 0.2s ease;
        }

        .table-hover tbody tr:hover {
            background: linear-gradient(to right, #f0f4ff, #f8f9ff);
            transform: scale(1.01);
            box-shadow: 0 4px 12px rgba(102, 126, 234, 0.1);
        }

        /* Modal backdrop */
        .modal-backdrop {
            background: rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(4px);
        }
    </style>
</head>
<body class="bg-gradient-to-br from-slate-50 via-blue-50 to-indigo-50 min-h-screen">

<!-- Toast Notification Container -->
<div id="toastContainer" class="fixed bottom-6 left-6 z-50 space-y-3 max-w-sm"></div>

<!-- Header -->
<header class="glass-effect border-b border-white/20 sticky top-0 z-40 shadow-lg">
    <div class="max-w-7xl mx-auto px-6 py-5">
        <div class="flex items-center justify-between">
            <!-- Logo -->
            <div class="flex items-center gap-3">
                <div class="w-10 h-10 gradient-bg rounded-xl flex items-center justify-center shadow-lg">
                    <svg class="w-6 h-6 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 6.253v13m0-13C10.832 5.477 9.246 5 7.5 5S4.168 5.477 3 6.253v13C4.168 18.477 5.754 18 7.5 18s3.332.477 4.5 1.253m0-13C13.168 5.477 14.754 5 16.5 5c1.747 0 3.332.477 4.5 1.253v13C19.832 18.477 18.247 18 16.5 18c-1.746 0-3.332.477-4.5 1.253" />
                    </svg>
                </div>
                <div>
                    <h1 class="text-2xl font-bold bg-gradient-to-r from-indigo-600 to-purple-600 bg-clip-text text-transparent">Admin Dashboard</h1>
                    <p class="text-xs text-slate-500">Manage your bookstore inventory</p>
                </div>
            </div>

            <!-- Navigation Actions -->
            <div class="flex items-center gap-3">
                <!-- Register User Button -->
                <a href="/admin/register-user"
                   class="inline-flex items-center gap-2 bg-gradient-to-r from-emerald-500 to-teal-600 hover:from-emerald-600 hover:to-teal-700 text-white px-5 py-2.5 rounded-xl transition-all font-medium shadow-md hover:shadow-lg transform hover:scale-105">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M18 9v3m0 0v3m0-3h3m-3 0h-3m-2-5a4 4 0 11-8 0 4 4 0 018 0zM3 20a6 6 0 0112 0v1H3v-1z"/>
                    </svg>
                    <span class="hidden sm:inline">Register User</span>
                </a>

                <!-- Logout Button -->
                <form id="logoutForm" th:action="@{/logout}" method="post" class="inline">
                    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                    <button type="submit"
                            class="inline-flex items-center gap-2 bg-white/80 hover:bg-white text-slate-700 px-5 py-2.5 rounded-xl transition-all font-medium border border-slate-200 shadow-md hover:shadow-lg transform hover:scale-105">
                        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1" />
                        </svg>
                        <span class="hidden sm:inline">Logout</span>
                    </button>
                </form>
            </div>
        </div>
    </div>
</header>

<main class="max-w-7xl mx-auto px-6 py-8">

    <!-- Action Bar -->
    <div class="bg-white/90 backdrop-blur-lg rounded-2xl shadow-xl border border-white/20 p-6 mb-8 fade-in">
        <div class="flex flex-col lg:flex-row gap-4 items-start lg:items-center justify-between">
            <div>
                <h2 class="text-2xl font-bold text-slate-900 mb-1">Books Management</h2>
                <p class="text-slate-600 text-sm">Add, edit, and manage your book inventory</p>
            </div>
            <button id="addBookBtn"
                    class="inline-flex items-center gap-2 bg-gradient-to-r from-indigo-600 to-purple-600 hover:from-indigo-700 hover:to-purple-700 text-white px-6 py-3 rounded-xl transition-all font-semibold shadow-lg hover:shadow-xl transform hover:scale-105">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4" />
                </svg>
                Add New Book
            </button>
        </div>
    </div>

    <!-- Filters Section -->
    <div class="bg-white/90 backdrop-blur-lg rounded-2xl shadow-xl border border-white/20 p-6 mb-8 slide-down">
        <div class="flex flex-col lg:flex-row gap-4">
            <!-- Search -->
            <div class="flex-1">
                <label for="searchInput" class="block text-sm font-semibold text-slate-700 mb-2">Search Books</label>
                <div class="relative">
                    <svg class="absolute left-4 top-1/2 -translate-y-1/2 w-5 h-5 text-indigo-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z" />
                    </svg>
                    <input id="searchInput"
                           type="text"
                           placeholder="Search by title, author, or ISBN..."
                           class="w-full pl-12 pr-4 py-3 border border-slate-200 rounded-xl bg-white focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-transparent transition-all shadow-sm" />
                </div>
            </div>

            <!-- Category Filter -->
            <div class="lg:w-64">
                <label for="categorySelect" class="block text-sm font-semibold text-slate-700 mb-2">Category</label>
                <div class="relative">
                    <select id="categorySelect"
                            class="w-full px-4 py-3 border border-slate-200 rounded-xl bg-white focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-transparent appearance-none cursor-pointer transition-all shadow-sm">
                        <option value="ALL">All Categories</option>
                    </select>
                    <svg class="absolute right-4 top-1/2 -translate-y-1/2 w-5 h-5 text-slate-400 pointer-events-none" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7" />
                    </svg>
                </div>
            </div>

            <!-- Clear Button -->
            <div class="lg:pt-7">
                <button id="clearFiltersBtn"
                        class="w-full lg:w-auto bg-gradient-to-r from-slate-100 to-slate-200 hover:from-slate-200 hover:to-slate-300 text-slate-700 px-6 py-3 rounded-xl border border-slate-300 font-semibold transition-all shadow-md hover:shadow-lg transform hover:scale-105">
                    <span class="flex items-center gap-2">
                        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" />
                        </svg>
                        Clear
                    </span>
                </button>
            </div>
        </div>
    </div>

    <!-- Status Message -->
    <div id="status" class="text-slate-600 mb-6 text-sm font-semibold flex items-center gap-2">
        <div class="w-2 h-2 bg-indigo-500 rounded-full animate-pulse"></div>
        <span></span>
    </div>

    <!-- Books Table -->
    <div class="bg-white/90 backdrop-blur-lg rounded-2xl shadow-xl border border-white/20 overflow-hidden fade-in">
        <div class="overflow-x-auto">
            <table class="w-full table-hover">
                <thead class="bg-gradient-to-r from-indigo-600 to-purple-600 text-white">
                <tr>
                    <th class="px-6 py-4 text-left text-xs font-bold uppercase tracking-wider">Cover</th>
                    <th class="px-6 py-4 text-left text-xs font-bold uppercase tracking-wider">Title</th>
                    <th class="px-6 py-4 text-left text-xs font-bold uppercase tracking-wider">Author</th>
                    <th class="px-6 py-4 text-left text-xs font-bold uppercase tracking-wider">ISBN</th>
                    <th class="px-6 py-4 text-left text-xs font-bold uppercase tracking-wider">Category</th>
                    <th class="px-6 py-4 text-left text-xs font-bold uppercase tracking-wider">Price</th>
                    <th class="px-6 py-4 text-left text-xs font-bold uppercase tracking-wider">Stock</th>
                    <!--                    <th class="px-6 py-4 text-left text-xs font-bold uppercase tracking-wider">Actions</th>-->
                </tr>
                </thead>
                <tbody id="booksTableBody" class="divide-y divide-slate-200">
                <!-- Books will be injected here -->
                </tbody>
            </table>
        </div>
    </div>

    <!-- Pagination Controls -->
    <div class="mt-8 flex items-center justify-center gap-3">
        <button id="prevPage"
                class="px-5 py-2.5 rounded-xl bg-white border-2 border-indigo-200 text-indigo-700 font-semibold shadow-md hover:shadow-lg disabled:opacity-50 disabled:cursor-not-allowed transition-all hover:scale-105">
            <svg class="w-5 h-5 inline mr-1" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7" />
            </svg>
            Previous
        </button>
        <span id="pageInfo" class="text-slate-700 font-semibold px-4 py-2 bg-white/80 rounded-xl border border-slate-200 shadow-sm"></span>
        <button id="nextPage"
                class="px-5 py-2.5 rounded-xl bg-white border-2 border-indigo-200 text-indigo-700 font-semibold shadow-md hover:shadow-lg disabled:opacity-50 disabled:cursor-not-allowed transition-all hover:scale-105">
            Next
            <svg class="w-5 h-5 inline ml-1" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7" />
            </svg>
        </button>
    </div>

    <!-- Empty State -->
    <div id="emptyState" class="hidden text-center py-20 fade-in">
        <div class="inline-flex items-center justify-center w-24 h-24 bg-gradient-to-br from-indigo-100 to-purple-100 rounded-full mb-6">
            <svg class="w-12 h-12 text-indigo-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 6.253v13m0-13C10.832 5.477 9.246 5 7.5 5S4.168 5.477 3 6.253v13C4.168 18.477 5.754 18 7.5 18s3.332.477 4.5 1.253m0-13C13.168 5.477 14.754 5 16.5 5c1.747 0 3.332.477 4.5 1.253v13C19.832 18.477 18.247 18 16.5 18c-1.746 0-3.332.477-4.5 1.253" />
            </svg>
        </div>
        <h3 class="text-2xl font-bold text-slate-900 mb-3">No books found</h3>
        <p class="text-slate-500 text-lg">Try adjusting your filters or add a new book</p>
    </div>
</main>

<!-- Add/Edit Book Modal -->
<div id="bookModal" class="hidden fixed inset-0 z-50 overflow-y-auto">
    <div class="flex items-center justify-center min-h-screen px-4 pt-4 pb-20 text-center sm:p-0">
        <!-- Backdrop -->
        <div class="fixed inset-0 modal-backdrop overlay-enter" onclick="closeModal()"></div>

        <!-- Modal Panel -->
        <div class="inline-block align-bottom bg-white rounded-2xl text-left overflow-hidden shadow-2xl transform transition-all sm:my-8 sm:align-middle sm:max-w-2xl sm:w-full modal-enter">
            <div class="bg-gradient-to-r from-indigo-600 to-purple-600 px-6 py-5">
                <div class="flex items-center justify-between">
                    <h3 class="text-2xl font-bold text-white" id="modalTitle">Add New Book</h3>
                    <button onclick="closeModal()" class="text-white/80 hover:text-white transition-colors">
                        <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" />
                        </svg>
                    </button>
                </div>
            </div>

            <form id="bookForm" class="p-6 space-y-5">
                <div class="grid grid-cols-1 md:grid-cols-2 gap-5">
                    <!-- Title -->
                    <div class="md:col-span-2">
                        <label for="bookTitle" class="block text-sm font-semibold text-slate-700 mb-2">
                            Book Title <span class="text-red-500">*</span>
                        </label>
                        <input type="text" id="bookTitle" required
                               class="w-full px-4 py-3 border border-slate-300 rounded-xl focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-transparent transition-all"
                               placeholder="Enter book title" />
                    </div>

                    <!-- Author -->
                    <div>
                        <label for="bookAuthor" class="block text-sm font-semibold text-slate-700 mb-2">
                            Author <span class="text-red-500">*</span>
                        </label>
                        <input type="text" id="bookAuthor" required
                               class="w-full px-4 py-3 border border-slate-300 rounded-xl focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-transparent transition-all"
                               placeholder="Enter author name" />
                    </div>

                    <!-- ISBN -->
                    <div>
                        <label for="bookIsbn" class="block text-sm font-semibold text-slate-700 mb-2">
                            ISBN <span class="text-red-500">*</span>
                        </label>
                        <input type="text" id="bookIsbn" required
                               class="w-full px-4 py-3 border border-slate-300 rounded-xl focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-transparent transition-all"
                               placeholder="Enter ISBN" />
                    </div>

                    <!-- Category -->
                    <div>
                        <label for="bookCategory" class="block text-sm font-semibold text-slate-700 mb-2">
                            Category <span class="text-red-500">*</span>
                        </label>
                        <select id="bookCategory" required
                                class="w-full px-4 py-3 border border-slate-300 rounded-xl focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-transparent appearance-none cursor-pointer transition-all">
                            <option value="">Select category</option>
                        </select>
                    </div>

                    <!-- Price -->
                    <div>
                        <label for="bookPrice" class="block text-sm font-semibold text-slate-700 mb-2">
                            Price (₱) <span class="text-red-500">*</span>
                        </label>
                        <input type="number" id="bookPrice" step="0.01" min="0" required
                               class="w-full px-4 py-3 border border-slate-300 rounded-xl focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-transparent transition-all"
                               placeholder="0.00" />
                    </div>

                    <!-- Stock -->
                    <div>
                        <label for="bookStock" class="block text-sm font-semibold text-slate-700 mb-2">
                            Stock <span class="text-red-500">*</span>
                        </label>
                        <input type="number" id="bookStock" min="0" required
                               class="w-full px-4 py-3 border border-slate-300 rounded-xl focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-transparent transition-all"
                               placeholder="0" />
                    </div>

                    <!-- Image URL -->
                    <div class="md:col-span-2">
                        <label for="bookImageUrl" class="block text-sm font-semibold text-slate-700 mb-2">
                            Image URL (Optional)
                        </label>
                        <input type="url" id="bookImageUrl"
                               class="w-full px-4 py-3 border border-slate-300 rounded-xl focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-transparent transition-all"
                               placeholder="https://example.com/book-cover.jpg" />
                    </div>
                </div>

                <!-- Modal Actions -->
                <div class="flex gap-3 pt-4 border-t border-slate-200">
                    <button type="button" onclick="closeModal()"
                            class="flex-1 px-6 py-3 border-2 border-slate-300 text-slate-700 rounded-xl font-semibold hover:bg-slate-50 transition-all">
                        Cancel
                    </button>
                    <button type="submit"
                            class="flex-1 px-6 py-3 bg-gradient-to-r from-indigo-600 to-purple-600 hover:from-indigo-700 hover:to-purple-700 text-white rounded-xl font-semibold shadow-lg hover:shadow-xl transition-all transform hover:scale-105">
                        <span id="submitBtnText">Add Book</span>
                    </button>
                </div>
            </form>
        </div>
    </div>
</div>

<!-- CSRF for AJAX -->
<input type="hidden" id="csrfHeader" th:value="${_csrf.headerName}"/>
<input type="hidden" id="csrfToken" th:value="${_csrf.token}"/>

<script>
    const statusEl = document.getElementById('status');
    const booksTableBody = document.getElementById('booksTableBody');
    const emptyState = document.getElementById('emptyState');
    const csrfHeader = document.getElementById('csrfHeader').value;
    const csrfToken = document.getElementById('csrfToken').value;
    const searchInput = document.getElementById('searchInput');
    const categorySelect = document.getElementById('categorySelect');
    const clearBtn = document.getElementById('clearFiltersBtn');
    const bookModal = document.getElementById('bookModal');
    const bookForm = document.getElementById('bookForm');
    const modalTitle = document.getElementById('modalTitle');
    const submitBtnText = document.getElementById('submitBtnText');
    const bookCategory = document.getElementById('bookCategory');

    let currentPage = 0;
    let pageSize = 10;
    let currentSort = 'title,asc';
    let editingBookId = null;

    // ========== Toast Notifications ==========
    function showToast(message, type = 'info', duration = 4000) {
        const container = document.getElementById('toastContainer');

        const icons = {
            success: `<svg class="w-6 h-6" fill="currentColor" viewBox="0 0 20 20"><path fill-rule="evenodd" d="M10 18a8 8 0 100-16 8 8 0 000 16zm3.707-9.293a1 1 0 00-1.414-1.414L9 10.586 7.707 9.293a1 1 0 00-1.414 1.414l2 2a1 1 0 001.414 0l4-4z" clip-rule="evenodd"/></svg>`,
            error: `<svg class="w-6 h-6" fill="currentColor" viewBox="0 0 20 20"><path fill-rule="evenodd" d="M10 18a8 8 0 100-16 8 8 0 000 16zM8.707 7.293a1 1 0 00-1.414 1.414L8.586 10l-1.293 1.293a1 1 0 101.414 1.414L10 11.414l1.293 1.293a1 1 0 001.414-1.414L11.414 10l1.293-1.293a1 1 0 00-1.414-1.414L10 8.586 8.707 7.293z" clip-rule="evenodd"/></svg>`,
            info: `<svg class="w-6 h-6" fill="currentColor" viewBox="0 0 20 20"><path fill-rule="evenodd" d="M18 10a8 8 0 11-16 0 8 8 0 0116 0zm-7-4a1 1 0 11-2 0 1 1 0 012 0zM9 9a1 1 0 000 2v3a1 1 0 001 1h1a1 1 0 100-2v-3a1 1 0 00-1-1H9z" clip-rule="evenodd"/></svg>`
        };

        const styles = {
            success: 'bg-gradient-to-r from-emerald-500 to-teal-600 text-white',
            error: 'bg-gradient-to-r from-red-500 to-rose-600 text-white',
            info: 'bg-gradient-to-r from-blue-500 to-indigo-600 text-white'
        };

        const toast = document.createElement('div');
        toast.className = `${styles[type]} rounded-xl p-4 shadow-2xl toast-enter flex items-center gap-3 min-w-[300px] border border-white/20`;

        toast.innerHTML = `
            <div class="flex-shrink-0">${icons[type]}</div>
            <p class="flex-1 font-medium text-sm leading-relaxed">${escapeHtml(message)}</p>
            <button onclick="this.parentElement.remove()" class="flex-shrink-0 hover:bg-white/20 rounded-lg p-1 transition-colors">
                <svg class="w-5 h-5" fill="currentColor" viewBox="0 0 20 20">
                    <path fill-rule="evenodd" d="M4.293 4.293a1 1 0 011.414 0L10 8.586l4.293-4.293a1 1 0 111.414 1.414L11.414 10l4.293 4.293a1 1 0 01-1.414 1.414L10 11.414l-4.293 4.293a1 1 0 01-1.414-1.414L8.586 10 4.293 5.707a1 1 0 010-1.414z" clip-rule="evenodd"/>
                </svg>
            </button>
        `;

        container.appendChild(toast);

        if (duration > 0) {
            setTimeout(() => {
                toast.classList.remove('toast-enter');
                toast.classList.add('toast-exit');
                setTimeout(() => toast.remove(), 300);
            }, duration);
        }
    }

    // Check URL parameters for success messages
    document.addEventListener('DOMContentLoaded', function() {
        const urlParams = new URLSearchParams(window.location.search);

        if (urlParams.has('registered')) {
            const email = decodeURIComponent(urlParams.get('registered'));
            showToast(`User ${email} registered successfully!`, 'success', 5000);
        }
    });

    // ========== Categories ==========
    async function loadCategories() {
        try {
            const res = await fetch('/api/categories', { credentials: 'same-origin' });
            if (!res.ok) throw new Error('HTTP ' + res.status);
            const cats = await res.json();

            const filterOptions = cats.map(c => `<option value="${escapeHtml(c.name)}">${escapeHtml(c.name)}</option>`).join('');
            categorySelect.insertAdjacentHTML('beforeend', filterOptions);


            const formOptions = cats.map(c =>
                `<option value="${c.id}">${escapeHtml(c.name)}</option>`
            ).join('');
            bookCategory.insertAdjacentHTML('beforeend', formOptions);
        } catch (e) {
            console.error('Failed to load categories:', e);
            showToast('Failed to load categories. Please refresh the page.', 'error');
        }
    }

    // ========== Generate Book Cover Image ==========
    function getBookCoverUrl(book) {
        if (book.imageUrl && book.imageUrl.trim()) {
            return book.imageUrl;
        }

        const title = encodeURIComponent(book.title || 'Book');
        const colors = [
            '667eea-764ba2', '6a11cb-2575fc', 'f093fb-f5576c',
            '4facfe-00f2fe', 'fa709a-fee140', 'ffecd2-fcb69f',
            'a8edea-fed6e3', 'ff9a9e-fecfef'
        ];
        const colorPair = colors[Math.abs(hashCode(book.title || '')) % colors.length];

        return `https://via.placeholder.com/120x180/${colorPair}/ffffff?text=${title}`;
    }

    function hashCode(str) {
        let hash = 0;
        for (let i = 0; i < str.length; i++) {
            const char = str.charCodeAt(i);
            hash = ((hash << 5) - hash) + char;
            hash = hash & hash;
        }
        return hash;
    }

    // ========== Load Books ==========
    async function loadBooks(q = '', category = '') {
        try {
            const params = new URLSearchParams();
            if (q && q.trim().length > 0) params.set('q', q.trim());
            if (category && category !== 'ALL') params.set('category', category);

            params.set('page', currentPage);
            params.set('size', pageSize);
            if (currentSort) params.set('sort', currentSort);

            const url = '/api/admin/books?' + params.toString();

            statusEl.querySelector('span').textContent = 'Loading books...';
            booksTableBody.innerHTML = '';
            emptyState.classList.add('hidden');

            const res = await fetch(url, { credentials: 'same-origin' });
            if (!res.ok) throw new Error('HTTP ' + res.status);

            const data = await res.json();
            const books = data.content ?? [];
            const totalPages = data.totalPages ?? 0;
            const totalElements = data.totalElements ?? books.length;

            statusEl.querySelector('span').textContent =
                `Showing ${books.length} of ${totalElements} book${totalElements !== 1 ? 's' : ''}`;

            if (books.length === 0) {
                booksTableBody.innerHTML = `
                    <tr>
                        <td colspan="8" class="px-6 py-16 text-center">
                            <div class="inline-flex items-center justify-center w-16 h-16 bg-gradient-to-br from-indigo-100 to-purple-100 rounded-full mb-4">
                                <svg class="w-8 h-8 text-indigo-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 6.253v13m0-13C10.832 5.477 9.246 5 7.5 5S4.168 5.477 3 6.253v13C4.168 18.477 5.754 18 7.5 18s3.332.477 4.5 1.253m0-13C13.168 5.477 14.754 5 16.5 5c1.747 0 3.332.477 4.5 1.253v13C19.832 18.477 18.247 18 16.5 18c-1.746 0-3.332.477-4.5 1.253" />
                                </svg>
                            </div>
                            <h3 class="text-xl font-bold text-slate-900 mb-2">No books found</h3>
                            <p class="text-slate-500">Try adjusting your filters or add a new book</p>
                        </td>
                    </tr>
                `;
            } else {
                books.forEach((b, idx) => {
                    const row = document.createElement('tr');
                    row.className = 'fade-in';
                    row.style.animationDelay = `${idx * 0.03}s`;

                    const stockBadge = b.stock > 0
                        ? `<span class="inline-flex items-center px-3 py-1 rounded-full text-xs font-bold bg-gradient-to-r from-emerald-500 to-teal-500 text-white">
                             <svg class="w-3 h-3 mr-1" fill="currentColor" viewBox="0 0 20 20"><circle cx="10" cy="10" r="3"/></svg>
                             ${b.stock}
                           </span>`
                        : `<span class="inline-flex items-center px-3 py-1 rounded-full text-xs font-bold bg-gradient-to-r from-red-500 to-rose-500 text-white">
                             Out of Stock
                           </span>`;

                    const coverUrl = getBookCoverUrl(b);

                    row.innerHTML = `
                        <td class="px-6 py-4">
                            <img src="${escapeHtml(coverUrl)}"
                                 alt="${escapeHtml(b.title)}"
                                 onerror="this.src='https://via.placeholder.com/120x180/667eea-764ba2/ffffff?text=No+Image'"
                                 class="w-12 h-18 object-cover rounded-lg shadow-md" />
                        </td>
                        <td class="px-6 py-4">
                            <div class="font-semibold text-slate-900">${escapeHtml(b.title ?? 'Untitled')}</div>
                        </td>
                        <td class="px-6 py-4">
                            <div class="text-slate-600">${escapeHtml(b.author ?? 'Unknown')}</div>
                        </td>
                        <td class="px-6 py-4">
                            <code class="text-xs bg-slate-100 px-2 py-1 rounded">${escapeHtml(b.isbn ?? 'N/A')}</code>
                        </td>
                        <td class="px-6 py-4">
                            <span class="inline-flex items-center px-3 py-1 rounded-lg text-xs font-semibold bg-gradient-to-r from-indigo-100 to-purple-100 text-indigo-700 border border-indigo-200">
                                ${escapeHtml(b.category?.name ?? b.categoryName ?? 'N/A')}
                            </span>
                        </td>
                        <td class="px-6 py-4">
                            <div class="font-bold text-lg text-indigo-600">₱${safe(b.price)}</div>
                        </td>
                        <td class="px-6 py-4">
                            ${stockBadge}
                        </td>
                    `;

                    booksTableBody.appendChild(row);
                });
            }

            updatePaginationUI({
                page: data.number ?? currentPage,
                totalPages: totalPages
            });

        } catch (e) {
            console.error(e);
            statusEl.className = 'text-red-600 mb-6 text-sm font-semibold flex items-center gap-2';
            statusEl.querySelector('span').textContent = 'Failed to load books.';
            showToast('Failed to load books: ' + e.message, 'error');
        }
    }

    const prevBtn = document.getElementById('prevPage');
    const nextBtn = document.getElementById('nextPage');
    const pageInfo = document.getElementById('pageInfo');

    function updatePaginationUI({ page, totalPages }) {
        currentPage = page;
        pageInfo.textContent = `Page ${page + 1} of ${Math.max(totalPages, 1)}`;
        prevBtn.disabled = page <= 0;
        nextBtn.disabled = page + 1 >= totalPages;
    }

    prevBtn.addEventListener('click', () => {
        if (currentPage > 0) {
            currentPage -= 1;
            applyFilters();
        }
    });

    nextBtn.addEventListener('click', () => {
        currentPage += 1;
        applyFilters(false);
    });

    // ========== Modal Functions ==========
    function openModal() {
        bookModal.classList.remove('hidden');
        document.body.style.overflow = 'hidden';
    }

    function closeModal() {
        bookModal.classList.add('hidden');
        document.body.style.overflow = 'auto';
        bookForm.reset();
        editingBookId = null;
        modalTitle.textContent = 'Add New Book';
        submitBtnText.textContent = 'Add Book';
    }

    document.getElementById('addBookBtn').addEventListener('click', openModal);

    // ========== Add/Edit Book ==========
    bookForm.addEventListener('submit', async (e) => {
        e.preventDefault();

        const bookData = {
            title: document.getElementById('bookTitle').value.trim(),
            author: document.getElementById('bookAuthor').value.trim(),
            isbn: document.getElementById('bookIsbn').value.trim(),
            categoryId: parseInt(document.getElementById('bookCategory').value, 10),
            price: parseFloat(document.getElementById('bookPrice').value),
            stock: parseInt(document.getElementById('bookStock').value),
            imageUrl: document.getElementById('bookImageUrl').value.trim() || null
        };

        try {
            const method = editingBookId ? 'PUT' : 'POST';
            const url = editingBookId ? `/api/admin/books/${editingBookId}` : '/api/admin/books';

            const res = await fetch(url, {
                method: method,
                credentials: 'same-origin',
                headers: {
                    'Content-Type': 'application/json',
                    [csrfHeader]: csrfToken
                },
                body: JSON.stringify(bookData)
            });

            if (!res.ok) {
                const txt = await res.text();
                throw new Error(txt || `HTTP ${res.status}`);
            }

            showToast(editingBookId ? 'Book updated successfully!' : 'Book added successfully!', 'success');
            closeModal();
            applyFilters();

        } catch (e) {
            console.error(e);
            showToast('Failed to save book: ' + e.message, 'error');
        }
    });

    // ========== Edit Book ==========
    async function editBook(bookId) {
        try {
            const res = await fetch(`/api/admin/books/${bookId}`, { credentials: 'same-origin' });
            if (!res.ok) throw new Error('HTTP ' + res.status);

            const book = await res.json();

            document.getElementById('bookTitle').value = book.title || '';
            document.getElementById('bookAuthor').value = book.author || '';
            document.getElementById('bookIsbn').value = book.isbn || '';
            document.getElementById('bookCategory').value = book.category?.id ?? '';
            document.getElementById('bookPrice').value = book.price || 0;
            document.getElementById('bookStock').value = book.stock || 0;
            document.getElementById('bookImageUrl').value = book.imageUrl || '';

            editingBookId = bookId;
            modalTitle.textContent = 'Edit Book';
            submitBtnText.textContent = 'Update Book';
            openModal();

        } catch (e) {
            console.error(e);
            showToast('Failed to load book details: ' + e.message, 'error');
        }
    }

    // ========== Delete Book ==========
    async function deleteBook(bookId, bookTitle) {
        if (!confirm(`Are you sure you want to delete "${bookTitle}"? This action cannot be undone.`)) {
            return;
        }

        try {
            const res = await fetch(`/api/admin/books/${bookId}`, {
                method: 'DELETE',
                credentials: 'same-origin',
                headers: {
                    [csrfHeader]: csrfToken
                }
            });

            if (!res.ok) {
                const txt = await res.text();
                throw new Error(txt || `HTTP ${res.status}`);
            }

            showToast('Book deleted successfully!', 'success');
            applyFilters();

        } catch (e) {
            console.error(e);
            showToast('Failed to delete book: ' + e.message, 'error');
        }
    }

    // ========== Filters ==========
    function applyFilters(resetPage = true) {
        // currentPage = 0;
        if(resetPage){
            currentPage = 0;
        }
        const q = searchInput.value || '';
        const category = categorySelect.value || '';
        loadBooks(q, category);
    }

    function debounce(fn, delay = 300) {
        let t;
        return (...args) => {
            clearTimeout(t);
            t = setTimeout(() => fn.apply(null, args), delay);
        };
    }

    // ========== Utilities ==========
    function escapeHtml(v) {
        if (v === null || v === undefined) return '';
        return String(v)
            .replace(/&/g, '&amp;')
            .replace(/</g, '&lt;')
            .replace(/>/g, '&gt;')
            .replace(/"/g, '&quot;')
            .replace(/'/g, '&#039;');
    }

    function safe(v) { return v ?? ''; }

    // ========== Event Listeners ==========
    searchInput.addEventListener('input', debounce(applyFilters, 300));
    categorySelect.addEventListener('change', applyFilters);
    clearBtn.addEventListener('click', (e) => {
        e.preventDefault();
        searchInput.value = '';
        categorySelect.value = 'ALL';
        applyFilters(false);
        showToast('Filters cleared', 'info', 2000);
    });

    // ========== Initialize ==========
    loadCategories().finally(() => applyFilters());
</script>
</body>
