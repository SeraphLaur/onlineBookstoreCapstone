<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8" />
    <title>Books - Modern Bookstore</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        * { font-family: 'Inter', sans-serif; }

        @keyframes slideInLeft {
            from {
                transform: translateX(-100%);
                opacity: 0;
            }
            to {
                transform: translateX(0);
                opacity: 1;
            }
        }

        @keyframes slideOutLeft {
            from {
                transform: translateX(0);
                opacity: 1;
            }
            to {
                transform: translateX(-100%);
                opacity: 0;
            }
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.15); }
        }

        @keyframes shimmer {
            0% { background-position: -1000px 0; }
            100% { background-position: 1000px 0; }
        }

        .toast-enter { animation: slideInLeft 0.4s cubic-bezier(0.68, -0.55, 0.265, 1.55); }
        .toast-exit { animation: slideOutLeft 0.3s ease-in; }
        .badge-pulse { animation: pulse 0.6s cubic-bezier(0.4, 0, 0.6, 1); }
        .fade-in { animation: fadeIn 0.5s ease-out; }

        .book-card {
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            background: linear-gradient(to bottom, #ffffff, #fafafa);
        }

        .book-card:hover {
            transform: translateY(-8px);
            box-shadow: 0 20px 40px -12px rgba(0,0,0,0.15);
        }

        .book-cover {
            aspect-ratio: 2/3;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            position: relative;
            overflow: hidden;
        }

        .book-cover::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.3), transparent);
            animation: shimmer 3s infinite;
        }

        .book-cover img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.3s ease;
        }

        .book-card:hover .book-cover img {
            transform: scale(1.05);
        }

        .gradient-bg {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        }

        .glass-effect {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
        }

        /* Custom Scrollbar */
        ::-webkit-scrollbar {
            width: 10px;
        }

        ::-webkit-scrollbar-track {
            background: #f1f1f1;
        }

        ::-webkit-scrollbar-thumb {
            background: #667eea;
            border-radius: 5px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: #5568d3;
        }

        /* Loading skeleton */
        .skeleton {
            background: linear-gradient(90deg, #f0f0f0 25%, #e0e0e0 50%, #f0f0f0 75%);
            background-size: 1000px 100%;
            animation: shimmer 2s infinite;
        }
    </style>
</head>
<body class="bg-gradient-to-br from-slate-50 via-blue-50 to-indigo-50 min-h-screen">

<!-- Toast Notification Container - Bottom Left -->
<div id="toastContainer" class="fixed bottom-6 left-6 z-50 space-y-3 max-w-sm"></div>

<!-- Header -->
<header class="glass-effect border-b border-white/20 sticky top-0 z-40 shadow-lg">
    <div class="max-w-7xl mx-auto px-6 py-5">
        <div class="flex items-center justify-between">
            <!-- Logo -->
            <div class="flex items-center gap-3">
                <div class="w-10 h-10 gradient-bg rounded-xl flex items-center justify-center shadow-lg">
                    <svg class="w-6 h-6 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 6.253v13m0-13C10.832 5.477 9.246 5 7.5 5S4.168 5.477 3 6.253v13C4.168 18.477 5.754 18 7.5 18s3.332.477 4.5 1.253m0-13C13.168 5.477 14.754 5 16.5 5c1.747 0 3.332.477 4.5 1.253v13C19.832 18.477 18.247 18 16.5 18c-1.746 0-3.332.477-4.5 1.253" />
                    </svg>
                </div>
                <div>
                    <h1 class="text-2xl font-bold bg-gradient-to-r from-indigo-600 to-purple-600 bg-clip-text text-transparent">Bookstore</h1>
                    <p class="text-xs text-slate-500">Discover your next favorite read</p>
                </div>
            </div>

            <div class="flex items-center gap-3">
                <!-- Orders Button -->
                <a href="/orders"
                   class="inline-flex items-center gap-2 bg-gradient-to-r from-emerald-500 to-teal-600 hover:from-emerald-600 hover:to-teal-700 text-white px-5 py-2.5 rounded-xl transition-all font-medium shadow-lg hover:shadow-xl transform hover:scale-105">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2" />
                    </svg>
                    <span class="hidden sm:inline">Orders</span>
                </a>

                <!-- Cart Button -->
                <a href="/cart"
                   class="relative inline-flex items-center gap-2 bg-gradient-to-r from-blue-600 to-indigo-600 hover:from-blue-700 hover:to-indigo-700 text-white px-5 py-2.5 rounded-xl transition-all font-medium shadow-lg hover:shadow-xl transform hover:scale-105">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 3h2l.4 2M7 13h10l4-8H5.4M7 13L5.4 5M7 13l-2.293 2.293c-.63.63-.184 1.707.707 1.707H17m0 0a2 2 0 100 4 2 2 0 000-4zm-8 2a2 2 0 11-4 0 2 2 0 014 0z" />
                    </svg>
                    <span class="hidden sm:inline">Cart</span>
                    <span id="cartBadge"
                          class="absolute -top-2 -right-2 inline-flex items-center justify-center text-xs font-bold bg-gradient-to-r from-pink-500 to-rose-500 text-white rounded-full min-w-[24px] h-6 px-1.5 shadow-lg">
                        0
                    </span>
                </a>

                <!-- Logout Button -->
                <form id="logoutForm" th:action="@{/logout}" method="post" class="inline">
                    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                    <button type="submit"
                            class="inline-flex items-center gap-2 bg-white/80 hover:bg-white text-slate-700 px-5 py-2.5 rounded-xl transition-all font-medium border border-slate-200 shadow-md hover:shadow-lg transform hover:scale-105">
                        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1" />
                        </svg>
                        <span class="hidden sm:inline">Logout</span>
                    </button>
                </form>
            </div>
        </div>
    </div>
</header>

<main class="max-w-7xl mx-auto px-6 py-8">

    <!-- Filters Section -->
    <div class="bg-white/90 backdrop-blur-lg rounded-2xl shadow-xl border border-white/20 p-6 mb-8 fade-in">
        <div class="flex flex-col lg:flex-row gap-4">
            <!-- Search -->
            <div class="flex-1">
                <label for="searchInput" class="block text-sm font-semibold text-slate-700 mb-2">Search Books</label>
                <div class="relative">
                    <svg class="absolute left-4 top-1/2 -translate-y-1/2 w-5 h-5 text-indigo-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z" />
                    </svg>
                    <input id="searchInput"
                           type="text"
                           placeholder="Search by title, author, or ISBN..."
                           class="w-full pl-12 pr-4 py-3 border border-slate-200 rounded-xl bg-white focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-transparent transition-all shadow-sm" />
                </div>
            </div>

            <!-- Category Filter -->
            <div class="lg:w-64">
                <label for="categorySelect" class="block text-sm font-semibold text-slate-700 mb-2">Category</label>
                <div class="relative">
                    <select id="categorySelect"
                            class="w-full px-4 py-3 border border-slate-200 rounded-xl bg-white focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-transparent appearance-none cursor-pointer transition-all shadow-sm">
                        <option value="ALL">All Categories</option>
                    </select>
                    <svg class="absolute right-4 top-1/2 -translate-y-1/2 w-5 h-5 text-slate-400 pointer-events-none" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7" />
                    </svg>
                </div>
            </div>

            <!-- Clear Button -->
            <div class="lg:pt-7">
                <button id="clearFiltersBtn"
                        class="w-full lg:w-auto bg-gradient-to-r from-slate-100 to-slate-200 hover:from-slate-200 hover:to-slate-300 text-slate-700 px-6 py-3 rounded-xl border border-slate-300 font-semibold transition-all shadow-md hover:shadow-lg transform hover:scale-105">
                    <span class="flex items-center gap-2">
                        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" />
                        </svg>
                        Clear Filters
                    </span>
                </button>
            </div>
        </div>
    </div>

    <!-- Status Message -->
    <div id="status" class="text-slate-600 mb-6 text-sm font-semibold flex items-center gap-2">
        <div class="w-2 h-2 bg-indigo-500 rounded-full animate-pulse"></div>
        <span></span>
    </div>

    <!-- Books Grid -->
    <div id="booksGrid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-6">
        <!-- Books will be injected here -->
    </div>

    <!-- Pagination Controls -->
    <div class="mt-8 flex items-center justify-center gap-2" id="paginationControls">
        <button id="prevPage"
                class="px-4 py-2 rounded-lg bg-white border border-slate-200 text-slate-700 shadow-sm disabled:opacity-50">
            Prev
        </button>
        <span id="pageInfo" class="text-slate-700 font-medium"></span>
        <button id="nextPage"
                class="px-4 py-2 rounded-lg bg-white border border-slate-200 text-slate-700 shadow-sm disabled:opacity-50">
            Next
        </button>

    </div>

    <!-- Empty State -->
    <div id="emptyState" class="hidden text-center py-20 fade-in">
        <div class="inline-flex items-center justify-center w-24 h-24 bg-gradient-to-br from-indigo-100 to-purple-100 rounded-full mb-6">
            <svg class="w-12 h-12 text-indigo-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 6.253v13m0-13C10.832 5.477 9.246 5 7.5 5S4.168 5.477 3 6.253v13C4.168 18.477 5.754 18 7.5 18s3.332.477 4.5 1.253m0-13C13.168 5.477 14.754 5 16.5 5c1.747 0 3.332.477 4.5 1.253v13C19.832 18.477 18.247 18 16.5 18c-1.746 0-3.332.477-4.5 1.253" />
            </svg>
        </div>
        <h3 class="text-2xl font-bold text-slate-900 mb-3">No books found</h3>
        <p class="text-slate-500 text-lg">Try adjusting your filters or search terms</p>
    </div>
</main>

<!-- CSRF for AJAX -->
<input type="hidden" id="csrfHeader" th:value="${_csrf.headerName}"/>
<input type="hidden" id="csrfToken"  th:value="${_csrf.token}"/>

<script>
    const statusEl = document.getElementById('status');
    const booksGrid = document.getElementById('booksGrid');
    const emptyState = document.getElementById('emptyState');
    const cartBadge = document.getElementById('cartBadge');
    const csrfHeader = document.getElementById('csrfHeader').value;
    const csrfToken = document.getElementById('csrfToken').value;
    const searchInput = document.getElementById('searchInput');
    const categorySelect = document.getElementById('categorySelect');
    const clearBtn = document.getElementById('clearFiltersBtn');

    let currentPage = 0;
    let pageSize = 6;
    let currentSort = 'title,asc';

    // ========== Toast Notifications (Bottom Left) ==========
    function showToast(message, type = 'info', duration = 4000) {
        const container = document.getElementById('toastContainer');

        const icons = {
            success: `<svg class="w-6 h-6" fill="currentColor" viewBox="0 0 20 20"><path fill-rule="evenodd" d="M10 18a8 8 0 100-16 8 8 0 000 16zm3.707-9.293a1 1 0 00-1.414-1.414L9 10.586 7.707 9.293a1 1 0 00-1.414 1.414l2 2a1 1 0 001.414 0l4-4z" clip-rule="evenodd"/></svg>`,
            error: `<svg class="w-6 h-6" fill="currentColor" viewBox="0 0 20 20"><path fill-rule="evenodd" d="M10 18a8 8 0 100-16 8 8 0 000 16zM8.707 7.293a1 1 0 00-1.414 1.414L8.586 10l-1.293 1.293a1 1 0 101.414 1.414L10 11.414l1.293 1.293a1 1 0 001.414-1.414L11.414 10l1.293-1.293a1 1 0 00-1.414-1.414L10 8.586 8.707 7.293z" clip-rule="evenodd"/></svg>`,
            info: `<svg class="w-6 h-6" fill="currentColor" viewBox="0 0 20 20"><path fill-rule="evenodd" d="M18 10a8 8 0 11-16 0 8 8 0 0116 0zm-7-4a1 1 0 11-2 0 1 1 0 012 0zM9 9a1 1 0 000 2v3a1 1 0 001 1h1a1 1 0 100-2v-3a1 1 0 00-1-1H9z" clip-rule="evenodd"/></svg>`
        };

        const styles = {
            success: 'bg-gradient-to-r from-emerald-500 to-teal-600 text-white',
            error: 'bg-gradient-to-r from-red-500 to-rose-600 text-white',
            info: 'bg-gradient-to-r from-blue-500 to-indigo-600 text-white'
        };

        const toast = document.createElement('div');
        toast.className = `${styles[type]} rounded-xl p-4 shadow-2xl toast-enter flex items-center gap-3 min-w-[300px] border border-white/20`;

        toast.innerHTML = `
            <div class="flex-shrink-0">${icons[type]}</div>
            <p class="flex-1 font-medium text-sm leading-relaxed">${escapeHtml(message)}</p>
            <button onclick="this.parentElement.remove()" class="flex-shrink-0 hover:bg-white/20 rounded-lg p-1 transition-colors">
                <svg class="w-5 h-5" fill="currentColor" viewBox="0 0 20 20">
                    <path fill-rule="evenodd" d="M4.293 4.293a1 1 0 011.414 0L10 8.586l4.293-4.293a1 1 0 111.414 1.414L11.414 10l4.293 4.293a1 1 0 01-1.414 1.414L10 11.414l-4.293 4.293a1 1 0 01-1.414-1.414L8.586 10 4.293 5.707a1 1 0 010-1.414z" clip-rule="evenodd"/>
                </svg>
            </button>
        `;

        container.appendChild(toast);

        if (duration > 0) {
            setTimeout(() => {
                toast.classList.remove('toast-enter');
                toast.classList.add('toast-exit');
                setTimeout(() => toast.remove(), 300);
            }, duration);
        }
    }

    // ========== Cart Badge ==========
    async function initCartBadge() {
        try {
            const res = await fetch('/api/cart', { credentials: 'same-origin' });
            if (!res.ok) throw new Error('HTTP ' + res.status);
            const cart = await res.json();
            updateCartBadge(cart.totalItems ?? 0);
        } catch {
            updateCartBadge(0);
        }
    }

    function updateCartBadge(count) {
        cartBadge.textContent = count;
        if (count > 0) {
            cartBadge.classList.add('badge-pulse');
            setTimeout(() => cartBadge.classList.remove('badge-pulse'), 600);
        }
    }

    // ========== Categories ==========
    async function loadCategories() {
        try {
            const res = await fetch('/api/categories', { credentials: 'same-origin' });
            if (!res.ok) throw new Error('HTTP ' + res.status);
            const cats = await res.json();
            const options = cats.map(c => `<option value="${escapeHtml(c.name)}">${escapeHtml(c.name)}</option>`).join('');
            categorySelect.insertAdjacentHTML('beforeend', options);
        } catch (e) {
            console.error('Failed to load categories:', e);
            showToast('Failed to load categories. Please refresh the page.', 'error');
        }
    }

    // ========== Generate Book Cover Image ==========
    function getBookCoverUrl(book) {
        // If book has imageUrl, use it
        if (book.imageUrl && book.imageUrl.trim()) {
            return book.imageUrl;
        }

        // Generate placeholder using title
        const title = encodeURIComponent(book.title || 'Book');
        const author = encodeURIComponent(book.author || 'Author');

        // Use a gradient-based placeholder service
        const colors = [
            '667eea-764ba2', '6a11cb-2575fc', 'f093fb-f5576c',
            '4facfe-00f2fe', 'fa709a-fee140', 'ffecd2-fcb69f',
            'a8edea-fed6e3', 'ff9a9e-fecfef', '667eea-764ba2'
        ];
        const colorPair = colors[Math.abs(hashCode(book.title || '')) % colors.length];

        return `https://via.placeholder.com/400x600/${colorPair}/ffffff?text=${title}`;
    }

    function hashCode(str) {
        let hash = 0;
        for (let i = 0; i < str.length; i++) {
            const char = str.charCodeAt(i);
            hash = ((hash << 5) - hash) + char;
            hash = hash & hash;
        }
        return hash;
    }

    // ========== Books Grid ==========
    async function loadBooks(q = '', category = '') {
        try {
            const params = new URLSearchParams();
            if (q && q.trim().length > 0) params.set('q', q.trim());
            if (category && category !== 'ALL') params.set('category', category);

            // NEW: pagination params
            params.set('page', currentPage);
            params.set('size', pageSize);
            if (currentSort) params.set('sort', currentSort);

            const url = '/api/books?' + params.toString();

            statusEl.querySelector('span').textContent = 'Loading books...';
            booksGrid.innerHTML = '';
            emptyState.classList.add('hidden');

            const res = await fetch(url, { credentials: 'same-origin' });
            if (!res.ok) throw new Error('HTTP ' + res.status);

            const data = await res.json();

            // If you used approach A (Page<Book>), this is correct:
            const books = data.content ?? [];
            const totalPages = data.totalPages ?? 0;
            const totalElements = data.totalElements ?? books.length;

            statusEl.querySelector('span').textContent =
                `Showing ${books.length} of ${totalElements} book${totalElements !== 1 ? 's' : ''}`;

            // Render items
            if (books.length === 0) {
                emptyState.classList.remove('hidden');
            } else {
                books.forEach((b, idx) => {
                    const card = document.createElement('div');
                    card.className = 'book-card rounded-2xl shadow-lg border border-slate-200 overflow-hidden fade-in';
                    card.style.animationDelay = `${idx * 0.05}s`;

                    const stockBadge = b.stock > 0
                        ? `<span class="inline-flex items-center px-3 py-1 rounded-full text-xs font-bold bg-gradient-to-r from-emerald-500 to-teal-500 text-white shadow-lg">
                         <svg class="w-3 h-3 mr-1" fill="currentColor" viewBox="0 0 20 20"><circle cx="10" cy="10" r="3"/></svg>
                         ${b.stock} in stock
                       </span>`
                        : `<span class="inline-flex items-center px-3 py-1 rounded-full text-xs font-bold bg-gradient-to-r from-red-500 to-rose-500 text-white shadow-lg">
                         Out of Stock
                       </span>`;

                    const coverUrl = getBookCoverUrl(b);

                    card.innerHTML = `
                    <div class="book-cover">
                        <img src="${escapeHtml(coverUrl)}"
                             alt="${escapeHtml(b.title)}"
                             onerror="this.src='https://via.placeholder.com/400x600/667eea-764ba2/ffffff?text=No+Image'"
                             loading="lazy" />
                    </div>
                    <div class="p-5">
                        <div class="mb-4">
                            <h3 class="text-lg font-bold text-slate-900 line-clamp-2 mb-2 leading-tight">
                                ${escapeHtml(b.title ?? 'Untitled')}
                            </h3>
                            <p class="text-slate-600 text-sm font-medium mb-1">
                                ${escapeHtml(b.author ?? 'Unknown Author')}
                            </p>
                            <p class="text-slate-400 text-xs font-mono">
                                ISBN: ${escapeHtml(b.isbn ?? 'N/A')}
                            </p>
                        </div>

                        <div class="flex items-center justify-between mb-4">
                            <span class="inline-flex items-center px-3 py-1.5 rounded-lg text-xs font-semibold bg-gradient-to-r from-indigo-100 to-purple-100 text-indigo-700 border border-indigo-200">
                                ${escapeHtml(b.category?.name ?? b.categoryName ?? 'Uncategorized')}
                            </span>
                            ${stockBadge}
                        </div>

                        <div class="flex items-center justify-between pt-4 border-t border-slate-200">
                            <div>
                                <div class="text-xs text-slate-500 font-medium mb-1">Price</div>
                                <span class="text-3xl font-bold bg-gradient-to-r from-indigo-600 to-purple-600 bg-clip-text text-transparent">
                                    ₱${safe(b.price)}
                                </span>
                            </div>
                            <button data-id="${safe(b.id)}"
                                    class="add-btn bg-gradient-to-r from-blue-600 to-indigo-600 hover:from-blue-700 hover:to-indigo-700 disabled:from-slate-300 disabled:to-slate-400 disabled:cursor-not-allowed text-white px-6 py-3 rounded-xl font-semibold transition-all shadow-lg hover:shadow-xl transform hover:scale-105 disabled:transform-none disabled:shadow-none"
                                    ${b.stock <= 0 ? 'disabled' : ''}>
                                ${b.stock > 0 ? `<span class="flex items-center gap-2">
                                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4" />
                                    </svg>
                                    Add to Cart
                                </span>` : 'Unavailable'}
                            </button>
                        </div>
                    </div>
                `;

                    booksGrid.appendChild(card);
                });

                // Wire up add to cart buttons
                document.querySelectorAll('.add-btn').forEach(btn => {
                    btn.addEventListener('click', () => addToCart(btn.dataset.id, 1, btn));
                });
            }

            // Update pagination UI
            updatePaginationUI({
                page: data.number ?? currentPage,
                totalPages: totalPages
            });

        } catch (e) {
            console.error(e);
            statusEl.className = 'text-red-600 mb-6 text-sm font-semibold flex items-center gap-2';
            statusEl.querySelector('span').textContent = 'Failed to load books.';
            showToast('Failed to load books: ' + e.message, 'error');
        }
    }

    const prevBtn = document.getElementById('prevPage');
    const nextBtn = document.getElementById('nextPage');
    const pageInfo = document.getElementById('pageInfo');

    function updatePaginationUI({ page, totalPages }) {
        currentPage = page; // sync with backend page
        pageInfo.textContent = `Page ${page + 1} of ${Math.max(totalPages, 1)}`;
        prevBtn.disabled = page <= 0;
        nextBtn.disabled = page + 1 >= totalPages;
    }

    prevBtn.addEventListener('click', () => {
        if (currentPage > 0) {
            currentPage -= 1;
            applyFilters(false);
        }
    });

    nextBtn.addEventListener('click', () => {
        currentPage += 1;
        applyFilters(false);
    });


    // ========== Add to Cart ==========
    async function addToCart(bookId, qty = 1, buttonEl) {
        buttonEl.disabled = true;
        const oldHTML = buttonEl.innerHTML;
        buttonEl.innerHTML = `
            <svg class="animate-spin w-5 h-5 mx-auto" fill="none" viewBox="0 0 24 24">
                <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
            </svg>
        `;

        try {
            const res = await fetch('/api/cart/items', {
                method: 'POST',
                credentials: 'same-origin',
                headers: {
                    'Content-Type': 'application/json',
                    [csrfHeader]: csrfToken
                },
                body: JSON.stringify({ bookId: Number(bookId), qty: Number(qty) })
            });

            if (!res.ok) {
                const txt = await res.text();
                throw new Error(txt || `HTTP ${res.status}`);
            }

            const cart = await res.json();
            updateCartBadge(cart.totalItems ?? 0);

            buttonEl.innerHTML = `
                <span class="flex items-center gap-2">
                    <svg class="w-5 h-5" fill="currentColor" viewBox="0 0 20 20">
                        <path fill-rule="evenodd" d="M10 18a8 8 0 100-16 8 8 0 000 16zm3.707-9.293a1 1 0 00-1.414-1.414L9 10.586 7.707 9.293a1 1 0 00-1.414 1.414l2 2a1 1 0 001.414 0l4-4z" clip-rule="evenodd"/>
                    </svg>
                    Added!
                </span>
            `;
            showToast('Book added to cart successfully!', 'success');

            setTimeout(() => {
                buttonEl.innerHTML = oldHTML;
                buttonEl.disabled = false;
            }, 2000);

        } catch (e) {
            console.error(e);
            showToast('Failed to add to cart: ' + e.message, 'error');
            buttonEl.innerHTML = oldHTML;
            buttonEl.disabled = false;
        }
    }

    // ========== Filters ==========
    function applyFilters(resetPage = true) {
        // currentPage = 0;
        if(resetPage){
            currentPage = 0;
        }
        const q = searchInput.value || '';
        const category = categorySelect.value || '';
        loadBooks(q, category);
    }

    function debounce(fn, delay = 300) {
        let t;
        return (...args) => {
            clearTimeout(t);
            t = setTimeout(() => fn.apply(null, args), delay);
        };
    }

    // ========== Utilities ==========
    function escapeHtml(v) {
        if (v === null || v === undefined) return '';
        return String(v)
            .replace(/&/g, '&amp;')
            .replace(/</g, '&lt;')
            .replace(/>/g, '&gt;')
            .replace(/"/g, '&quot;')
            .replace(/'/g, '&#039;');
    }

    function safe(v) { return v ?? ''; }

    // ========== Event Listeners ==========
    searchInput.addEventListener('input', debounce(applyFilters, 300));
    categorySelect.addEventListener('change', applyFilters);
    clearBtn.addEventListener('click', (e) => {
        e.preventDefault();
        searchInput.value = '';
        categorySelect.value = 'ALL';
        applyFilters(false);
        showToast('Filters cleared', 'info', 2000);
    });

    // ========== Initialize ==========
    initCartBadge();
    loadCategories().finally(() => applyFilters());
</script>
</body>
</html>
